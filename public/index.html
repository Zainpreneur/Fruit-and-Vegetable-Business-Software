<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GreenBasket · Fruit &amp; Vegetable Store Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-logo">🥬</span>
        <div class="brand-text">
          <strong>GreenBasket</strong>
          <small>Store Manager</small>
        </div>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ico">📊</span><span class="lbl">Dashboard</span></a>
        <a href="#/pos" data-route="pos"><span class="ico">🛒</span><span class="lbl">New Sale</span></a>
        <a href="#/orders" data-route="orders"><span class="ico">🧾</span><span class="lbl">Orders</span></a>
        <a href="#/products" data-route="products"><span class="ico">🍎</span><span class="lbl">Products</span></a>
        <a href="#/inventory" data-route="inventory"><span class="ico">📦</span><span class="lbl">Inventory</span></a>
        <a href="#/customers" data-route="customers"><span class="ico">👥</span><span class="lbl">Customers</span></a>
        <a href="#/suppliers" data-route="suppliers"><span class="ico">🚚</span><span class="lbl">Suppliers</span></a>
        <a href="#/reports" data-route="reports"><span class="ico">📈</span><span class="lbl">Reports</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="settings-btn">⚙️ <span class="lbl">Settings</span></button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="hamburger" aria-label="Toggle menu">☰</button>
        <h1 id="view-title">Dashboard</h1>
        <div class="topbar-right">
          <span id="topbar-date"></span>
          <a class="btn primary sm" href="#/pos">＋ New Sale</a>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="print-area"></div>
  <div id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
